name: Canon Product Monitor

# GitHub 스케줄은 몇 시간씩 지연되므로, 한 번 시작된 실행이 내부에서
# INTERVAL_SECONDS마다 반복 확인하다가 LOOP_MINUTES 후 종료한다.
# 매시간 스케줄 + concurrency 대기열 덕분에 끝나면 다음 실행이 바로 이어진다.
# (공개 저장소에서는 Actions 사용량 무제한)
#
# 일부 러너(IP)는 캐논 사이트 접속이 아예 막혀서 그 실행 내내 실패한다.
# 그래서 한 실행 안에서 연속 실패하면 새 실행(새 러너)을 띄우고 바로 종료한다.

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      loop_minutes:
        description: '반복 실행 시간(분). 0이면 한 번만 확인'
        default: '340'
      interval_seconds:
        description: '확인 간격(초)'
        default: '300'
      reroll:
        description: '접속 차단으로 러너를 바꾼 횟수 (자동으로 채워짐)'
        default: '0'

permissions:
  contents: write
  actions: write # 접속이 막힌 러너에서 새 실행을 띄우기 위함

concurrency:
  group: canon-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04 # ubuntu-latest(26.04)는 Playwright 1.57 미지원
    timeout-minutes: 355 # GitHub 최대 360분

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # 대기열에서 오래 기다린 실행은 예약 시점의 커밋을 받아와서, 그 사이 쌓인
          # 데이터 커밋과 충돌해 push가 계속 실패한다. 항상 브랜치 최신을 받는다.
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Monitor loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_KEYWORDS: ${{ vars.WATCH_KEYWORDS }}
          LOOP_MINUTES: ${{ inputs.loop_minutes || '340' }}
          INTERVAL_SECONDS: ${{ inputs.interval_seconds || '300' }}
          REROLL: ${{ inputs.reroll || '0' }}
          MAX_REROLLS: '4' # 이만큼 바꿔도 안 되면 사이트 문제로 보고 그냥 계속 반복
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + LOOP_MINUTES * 60 ))
          fails=0
          while true; do
            if node src/index.js; then
              fails=0
            else
              fails=$(( fails + 1 ))
              echo "::warning::Monitor run failed ($fails in a row on this runner)"
            fi
            git add data/products.json data/status.json
            if git commit -q -m "Update product data [skip ci]"; then
              # 데이터 파일 충돌 시 방금 만든(최신) 쪽을 우선
              if git pull -q --rebase -X theirs origin "$GITHUB_REF_NAME"; then
                git push -q || echo "::warning::Push failed"
              else
                git rebase --abort; echo "::warning::Pull failed"
              fi
            fi
            if [ "$fails" -ge 2 ] && [ "$REROLL" -lt "$MAX_REROLLS" ]; then
              echo "::warning::이 러너에서 연속 실패 → 새 러너로 다시 실행 (reroll $(( REROLL + 1 )))"
              gh workflow run monitor.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" \
                -f loop_minutes="$LOOP_MINUTES" -f interval_seconds="$INTERVAL_SECONDS" \
                -f reroll=$(( REROLL + 1 )) && break
            fi
            [ $(( $(date +%s) + INTERVAL_SECONDS )) -lt "$end" ] || break
            sleep "$INTERVAL_SECONDS"
          done
