name: Canon Product Monitor

on:
  schedule:
    - cron: '*/5 * * * *' # Run every 5 minutes (GitHub minimum)
  workflow_dispatch: # Add manual trigger button

permissions:
  contents: write

concurrency:
  group: canon-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run Monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WATCH_KEYWORDS: ${{ vars.WATCH_KEYWORDS }}
        run: node src/index.js

      - name: Commit and Push changes
        if: always()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/products.json data/status.json
          if git commit -m "Update product data [skip ci]"; then
            git pull --rebase origin main && git push
          else
            echo "No changes to commit"
          fi
